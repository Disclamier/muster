# Daily data refresh + GitHub Pages publish for Muster.
# See README "Deploy".
name: Refresh points & publish

on:
  schedule:
    - cron: "37 9 * * *"    # daily 09:37 UTC (04:37 CDT / 03:37 CST), off-peak
  workflow_dispatch: {}
  push:
    branches: [main]      # every push to main: tests + deploy (no scrape). The bot's data commits use GITHUB_TOKEN and don't re-trigger.

permissions:
  contents: write    # commit refreshed data back to the repo
  pages: write
  id-token: write

concurrency:
  group: refresh-and-pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Supabase free projects pause after ~7 days without activity; one tiny read a day keeps accounts/sync awake.
      # URL/key come from repo secrets SUPABASE_URL / SUPABASE_ANON_KEY if set, else from app/js/config.js (the anon key
      # is public by design). Skipped when sync isn't configured; never fails the run.
      - name: Keep Supabase project awake
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SB_URL: ${{ secrets.SUPABASE_URL }}
          SB_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          url="${SB_URL:-$(sed -nE 's/.*SUPABASE_URL:[[:space:]]*"([^"]*)".*/\1/p' app/js/config.js | head -1)}"
          key="${SB_KEY:-$(sed -nE 's/.*SUPABASE_ANON_KEY:[[:space:]]*"([^"]*)".*/\1/p' app/js/config.js | head -1)}"
          if [ -z "$url" ] || [ -z "$key" ]; then echo "Supabase not configured - skipping keep-alive"; exit 0; fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "${url%/}/rest/v1/lists?select=id&limit=1" \
            -H "apikey: $key" -H "Authorization: Bearer $key" || echo "000")
          echo "Supabase keep-alive ping: HTTP $code"
          case "$code" in 2*) exit 0;; *) echo "::warning::Supabase keep-alive got HTTP $code"; exit 0;; esac
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Raw scraper output (data/*.json) is not committed. The last good copy is carried between runs in the
      # Actions cache so a GrimSlate / listhammer outage falls back to yesterday's data instead of failing.
      - name: Restore last good scraper data
        uses: actions/cache@v4
        with:
          path: |
            data/mfm.json
            data/grimslate.json
            data/winrates.json
            data/core_stratagems.json
          key: scraped-${{ github.run_id }}
          restore-keys: scraped-
      - name: Install image tooling (faction artwork) + points-audit deps
        run: pip install pillow websocket-client beautifulsoup4 lxml
      # Fails safe: on any scrape/build problem refresh.sh exits non-zero WITHOUT touching app/data, this step is
      # allowed to fail, and the tests + Pages publish below run on the previously published data.
      - name: Refresh data (keeps previous data if a scrape fails)
        if: github.event_name != 'push'
        id: refresh
        continue-on-error: true
        run: bash scripts/refresh.sh
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Tests (a failure stops here - nothing committed, site not redeployed)
        run: cd tests && npm ci && npm test
      # POINTS GUARD. Re-reads the live Munitorum Field Manual a second, independent way (headless Chrome renders every
      # faction page with Legends shown; audit/mfm_parse.py parses the DOM - no code shared with scraper/) and prices
      # every unit size, add-on, wargear line, loadout option (x copies), enhancement and detachment DP through the
      # app's own core.js. Any mismatch (or an MFM page that can't be read) fails this step, so nothing below runs:
      # no data commit, no Pages publish - the live site keeps its last verified data and the failed run (with
      # ::error annotations + the job summary) is the alarm. Runs on pushes too, so code changes can't break points.
      - name: Points audit vs live Munitorum Field Manual (blocks publishing on any mismatch)
        run: |
          set -o pipefail
          python3 audit/mfm_dump.py audit/out/dom
          python3 audit/mfm_parse.py audit/out/dom > audit/out/mfm_audit.json
          node audit/check_points.js audit/out/mfm_audit.json --json audit/out/result.json --verbose | tee audit/out/report.txt
      - name: Points audit report
        if: always()
        run: |
          [ -f audit/out/report.txt ] || exit 0
          { echo '### MFM points audit'; echo '```'; grep -v '^  spot:\|^  info:' audit/out/report.txt | head -200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mfm-points-audit
          path: audit/out/
          if-no-files-found: ignore
          retention-days: 14
      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "muster-bot"
          git config user.email "muster-bot@users.noreply.github.com"
          git add app/data app/assets/factions data/build_stats.json || true
          if git diff --cached --quiet; then echo "No data changes"; else git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
  deploy:
    needs: refresh
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
