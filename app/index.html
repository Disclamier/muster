<script>
  // apply saved theme before first paint
  (function () { try { var t = localStorage.getItem("muster.theme"); if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
</script>
<script>
  // per-device color settings (Colors screen): CSS custom properties on <html>, applied before first paint
  window.MusterColors = (function () {
    var KEY = "muster.colors";
    // def: built-in default (null = today's look / theme text color). Dispositions: Games Workshop's 11th-edition colors.
    var CATS = [
      { k: "det", label: "Detachments", desc: "Detachment names, rule titles and rule text", def: "#39ff14" },
      { k: "strat", label: "Stratagems", desc: "Stratagem names everywhere they show", def: null },
      { k: "cat", label: "Unit catalog", desc: "Unit names in the catalog where you pick units", def: null },
      { k: "abil", label: "Abilities", desc: "Ability names on datasheets (Core, Faction, Abilities, Wargear, Damaged)", def: null },
      { k: "aura", label: "Auras", desc: "Aura abilities on datasheets", def: null, dflt: "#8a5cd1" },
      { k: "enh", label: "Enhancements", desc: "Enhancement names in the dropdown and detachment rules", def: null },
      { k: "disp-take-and-hold", label: "Take and Hold", def: "#196819", disp: 1 },
      { k: "disp-disruption", label: "Disruption", def: "#02486a", disp: 1 },
      { k: "disp-purge-the-foe", label: "Purge the Foe", def: "#761b1a", disp: 1 },
      { k: "disp-priority-assets", label: "Priority Assets", def: "#907703", disp: 1 },
      { k: "disp-reconnaissance", label: "Reconnaissance", def: "#056863", disp: 1 }
    ];
    var ok = function (v) { return typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v); };
    function load() { try { var o = JSON.parse(localStorage.getItem(KEY) || "{}"); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; } }
    // readable text on top of a color: black on light colors, white on dark ones
    function fg(hex) { var n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
      return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] > 0.25 ? "#000" : "#fff"; }
    function apply(o) {
      var r = document.documentElement; o = o || load();
      CATS.forEach(function (c) { var v = o[c.k];
        if (ok(v)) { r.style.setProperty("--c-" + c.k, v); r.style.setProperty("--c-" + c.k + "-fg", fg(v)); r.setAttribute("data-c-" + c.k, ""); }
        else { r.style.removeProperty("--c-" + c.k); r.style.removeProperty("--c-" + c.k + "-fg"); r.removeAttribute("data-c-" + c.k); } });
    }
    function save(o) { try { if (Object.keys(o).length) localStorage.setItem(KEY, JSON.stringify(o)); else localStorage.removeItem(KEY); } catch (e) { /* ignore */ } apply(o); }
    function set(k, v) { var o = load(); if (ok(v)) o[k] = v.toLowerCase(); else delete o[k]; save(o); }
    function get(k) { var v = load()[k]; return ok(v) ? v.toLowerCase() : null; }
    function cat(k) { for (var i = 0; i < CATS.length; i++) if (CATS[i].k === k) return CATS[i]; return null; }
    try { apply(); } catch (e) { /* ignore */ }
    return { KEY: KEY, CATS: CATS, load: load, apply: apply, set: set, get: get, cat: cat, fg: fg, ok: ok, resetAll: function () { save({}); } };
  })();
</script>
</head>
<body>
<header id="hdr">
  <a class="brand" href="#/lists"><img src="icons/icon-192.png" alt=""><span>Muster</span><small>40K 11th Ed.</small></a>
  <a class="hbtn" href="#/lists" data-nav="#/list" title="My lists"><svg class="i"><use href="#i-lists"/></svg><span>Lists</span></a>
  <a class="hbtn" href="#/meta" data-nav="#/meta" title="Meta win rates (listhammer.info)"><svg class="i"><use href="#i-chart"/></svg><span><span class="lbl-long">Meta Win Rates</span><span class="lbl-short">Meta</span></span></a>
  <button class="hbtn green" data-action="new-list" title="Create list"><svg class="i"><use href="#i-plus"/></svg><span>New</span></button>
  <span class="spacer"></span>
  <button class="hbtn acct" id="acct" data-action="account" title="Account &amp; sync" hidden><span class="sico"><svg class="i"><use href="#i-cloud"/></svg><span class="sdot"></span></span><span class="lbl lbl-opt">Account</span></button>
  <button class="hbtn" data-action="colors" title="Colors" aria-label="Colors"><svg class="i"><use href="#i-palette"/></svg><span class="lbl-opt">Colors</span></button>
  <button class="hbtn" data-action="toggle-theme" title="Dark / light mode"><svg class="i"><use href="#i-moon"/></svg><span class="lbl-opt">Theme</span></button>
  <button class="hbtn" data-action="about" title="About"><svg class="i"><use href="#i-info"/></svg><span class="lbl-opt">About</span></button>
  <button class="hbtn reload" data-action="reload-page" title="Refresh page (also checks for new points and app updates)" aria-label="Refresh page"><svg class="i"><use href="#i-refresh"/></svg><span class="lbl-opt">Refresh</span></button>
</header>
