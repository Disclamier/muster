<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muster – 40K army list builder (unofficial)</title>
<meta name="description" content="Offline army list builder with current Munitorum Field Manual points. Unofficial fan tool.">
<meta name="theme-color" content="#3C4043">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/app.css">
<script>
  // apply saved theme before first paint
  (function () { try { var t = localStorage.getItem("muster.theme"); if (!t) t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"; document.documentElement.setAttribute("data-theme", t); } catch (e) {} })();
</script>
<script>
  // per-device color settings (Colors screen): CSS custom properties on <html>, applied before first paint
  window.MusterColors = (function () {
    var KEY = "muster.colors";
    // def: built-in default (null = today's look / theme text color). Dispositions: Games Workshop's 11th-edition colors.
    var CATS = [
      { k: "det", label: "Detachments", desc: "Detachment names, rule titles and rule text", def: "#39ff14" },
      { k: "strat", label: "Stratagems", desc: "Stratagem names everywhere they show", def: null },
      { k: "cat", label: "Unit catalog", desc: "Unit names in the catalog where you pick units", def: null },
      { k: "list", label: "Units in your list", desc: "Unit names in the list you're building", def: null },
      { k: "attach", label: "Attached units", desc: "Border around a character and the unit it leads", def: "#e0a526" },
      { k: "abil", label: "Abilities", desc: "Ability names on datasheets (Core, Faction, Abilities, Wargear, Damaged)", def: null },
      { k: "aura", label: "Auras", desc: "Aura abilities on datasheets", def: null, dflt: "#8a5cd1" },
      { k: "enh", label: "Enhancements", desc: "Enhancement names in the dropdown and detachment rules", def: null },
      { k: "disp-take-and-hold", label: "Take and Hold", def: "#196819", disp: 1 },
      { k: "disp-disruption", label: "Disruption", def: "#02486a", disp: 1 },
      { k: "disp-purge-the-foe", label: "Purge the Foe", def: "#761b1a", disp: 1 },
      { k: "disp-priority-assets", label: "Priority Assets", def: "#907703", disp: 1 },
      { k: "disp-reconnaissance", label: "Reconnaissance", def: "#056863", disp: 1 }
    ];
    var ok = function (v) { return typeof v === "string" && /^#[0-9a-f]{6}$/i.test(v); };
    // Per-faction colors (James, Oct 8): each faction (sub-faction id of the open list, e.g. "chaos-daemons",
    // "blood-angels") has its own set in "muster.colors.f.<id>"; faction without a set = built-in defaults.
    // Force Disposition colors ("disp-*") are GW's official ones and stay shared by all factions in "muster.colors".
    var FKEY = "muster.colors.f.", scope = null;
    var isDisp = function (k) { return k.indexOf("disp-") === 0; };
    function rd(k) { try { var o = JSON.parse(localStorage.getItem(k) || "{}"); return o && typeof o === "object" && !Array.isArray(o) ? o : {}; } catch (e) { return {}; } }
    function wr(k, o) { try { if (Object.keys(o).length) localStorage.setItem(k, JSON.stringify(o)); else localStorage.removeItem(k); } catch (e) { /* ignore */ } }
    function pick(o, disp) { var r = {}; for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k) && isDisp(k) === disp) r[k] = o[k]; return r; }
    // effective settings for the current scope: shared dispositions + this faction's own colors
    function load() { var o = pick(rd(KEY), true), f = scope ? pick(rd(FKEY + scope), false) : {}; for (var k in f) o[k] = f[k]; return o; }
    // faction of a list from the URL (#/list/<id>) using the saved lists, so colors apply before first paint
    function scopeOfHash(h) { var m = /^#\/list\/([^/?#]+)/.exec(h || ""); if (!m) return null; var id = decodeURIComponent(m[1]);
      try { var ls = JSON.parse(localStorage.getItem("muster.lists") || "[]"); for (var i = 0; i < ls.length; i++) if (ls[i] && ls[i].id === id) return ls[i].sub || ls[i].faction || null; } catch (e) { /* ignore */ }
      return null; }
    // one-time move of the old single (global) set: its non-disposition colors go to the faction of the most recently
    // edited list (where they were being set up); dispositions stay shared
    function migrate() {
      try { if (localStorage.getItem("muster.colors.v") === "2") return; var g = rd(KEY), own = pick(g, false);
        if (Object.keys(own).length) { var ls = JSON.parse(localStorage.getItem("muster.lists") || "[]").filter(function (l) { return l && (l.sub || l.faction); })
            .sort(function (a, b) { return String(b.updated || "").localeCompare(String(a.updated || "")); });
          if (ls.length) { var fk = FKEY + (ls[0].sub || ls[0].faction); if (!localStorage.getItem(fk)) wr(fk, own); }
          wr(KEY, pick(g, true)); }
        localStorage.setItem("muster.colors.v", "2"); } catch (e) { /* ignore */ } }
    // readable text on top of a color: black on light colors, white on dark ones
    function fg(hex) { var n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(function (x) { x /= 255; return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4); });
      return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2] > 0.25 ? "#000" : "#fff"; }
    // brightness: -50 (darker) .. +50 (brighter), stored as "<key>_b" next to the picked color; hue + saturation stay the same
    function bOf(o, k) { var b = Math.round(Number(o[k + "_b"])); return isFinite(b) ? Math.max(-50, Math.min(50, b)) : 0; }
    function hsl(hex) { var n = parseInt(hex.slice(1), 16), r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255,
        mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn, h = 0, s = 0;
      if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
      return [h, s, l]; }
    function hex(h, s, l) { var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2, i = Math.floor(h / 60) % 6,
        rgb = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][i];
      return "#" + rgb.map(function (v) { return ("0" + Math.round((v + m) * 255).toString(16)).slice(-2); }).join(""); }
    // +50 moves lightness 90% of the way to white, -50 90% of the way to black; 0 = the color itself
    function shade(h0, b) { if (!ok(h0) || !b) return ok(h0) ? h0.toLowerCase() : h0; var t = hsl(h0), f = Math.abs(b) / 50 * 0.9;
      return hex(t[0], t[1], b > 0 ? t[2] + (1 - t[2]) * f : t[2] * (1 - f)); }
    // the base the slider works on: the picked color, else the built-in default (null-default categories need a picked color)
    function base(o, c) { return ok(o[c.k]) ? o[c.k].toLowerCase() : c.def || c.dflt || null; }
    function eff(o, c) { var b = bOf(o, c.k), v = base(o, c); if (ok(o[c.k])) return shade(v, b); return b && v ? shade(v, b) : null; }
    function apply(o) {
      var r = document.documentElement; o = o || load();
      CATS.forEach(function (c) { var v = eff(o, c);
        if (ok(v)) { r.style.setProperty("--c-" + c.k, v); r.style.setProperty("--c-" + c.k + "-fg", fg(v)); r.setAttribute("data-c-" + c.k, ""); }
        else { r.style.removeProperty("--c-" + c.k); r.style.removeProperty("--c-" + c.k + "-fg"); r.removeAttribute("data-c-" + c.k); } });
    }
    // every local change stamps the whole bundle (account sync: newest bundle wins across devices)
    var UKEY = "muster.colors.updatedAt", api = null;
    function touch() { try { localStorage.setItem(UKEY, String(Date.now())); } catch (e) { /* ignore */ } if (api && api.onChange) try { api.onChange(); } catch (e) { /* ignore */ } }
    function save(o) { wr(KEY, pick(o, true));
      if (scope) wr(FKEY + scope, pick(o, false)); apply(); touch(); }
    function fkeys() { var r = []; try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(FKEY) === 0) r.push(k); } } catch (e) { /* ignore */ } return r; }
    // the whole color setup for the account: shared disposition colors + every faction's set
    function bundle() { var f = {}, any = Object.keys(rd(KEY)).length > 0;
      fkeys().forEach(function (k) { var o = rd(k); if (Object.keys(o).length) { f[k.slice(FKEY.length)] = o; any = true; } });
      var t = Number(localStorage.getItem(UKEY)) || 0; return { v: 1, updatedAt: t || (any ? 1 : 0), shared: rd(KEY), f: f }; }
    function clean(o) { var r = {}; if (!o || typeof o !== "object") return r;
      for (var k in o) if (Object.prototype.hasOwnProperty.call(o, k) && k.length < 40) { var v = o[k];
        if (/_b$/.test(k) ? typeof v === "number" && isFinite(v) : ok(v)) r[k] = v; } return r; }
    // replace this device's colors with a bundle from the account (no stamp/onChange: it is already in sync)
    function setBundle(b) { if (!b || typeof b !== "object") return false;
      fkeys().forEach(function (k) { try { localStorage.removeItem(k); } catch (e) { /* ignore */ } });
      wr(KEY, pick(clean(b.shared), true));
      var f = b.f && typeof b.f === "object" ? b.f : {};
      for (var id in f) if (Object.prototype.hasOwnProperty.call(f, id) && /^[a-z0-9-]{1,60}$/.test(id)) wr(FKEY + id, pick(clean(f[id]), false));
      try { localStorage.setItem(UKEY, String(Number(b.updatedAt) || 0)); localStorage.setItem("muster.colors.v", "2"); } catch (e) { /* ignore */ }
      apply(); return true; }
    function setScope(id) { id = id || null; if (id === scope) return false; scope = id; apply(); return true; }
    // set(k, null) = Reset: drops the color and its brightness
    function set(k, v) { var o = load(); if (ok(v)) o[k] = v.toLowerCase(); else { delete o[k]; delete o[k + "_b"]; } save(o); }
    function setB(k, b) { var o = load(); b = Math.max(-50, Math.min(50, Math.round(Number(b) || 0))); if (b) o[k + "_b"] = b; else delete o[k + "_b"]; save(o); }
    function get(k) { var v = load()[k]; return ok(v) ? v.toLowerCase() : null; }
    function cat(k) { for (var i = 0; i < CATS.length; i++) if (CATS[i].k === k) return CATS[i]; return null; }
    try { migrate(); scope = scopeOfHash(location.hash); apply(); } catch (e) { /* ignore */ }
    return api = { KEY: KEY, CATS: CATS, load: load, apply: apply, set: set, get: get, cat: cat, fg: fg, ok: ok, setB: setB, shade: shade,
      getB: function (k) { return bOf(load(), k); }, base: function (k) { return base(load(), cat(k)); }, effective: function (k) { return eff(load(), cat(k)); }, // Reset all: this faction's colors (dispositions keep theirs); with no list open, the shared disposition colors
      resetAll: function () { if (scope) wr(FKEY + scope, {}); else wr(KEY, {}); apply(); touch(); },
      bundle: bundle, setBundle: setBundle, UKEY: UKEY, onChange: null,
      setScope: setScope, scope: function () { return scope; }, scopeOfHash: scopeOfHash, FKEY: FKEY, isDisp: isDisp };
  })();
</script>

  <a class="hbtn" href="#/meta" data-nav="#/meta" data-nav-phone="#/rules" title="Meta win rates (listhammer.info)"><svg class="i"><use href="#i-chart"/></svg><span><span class="lbl-long">Meta Win Rates</span><span class="lbl-short">Meta</span></span></a>

  <button class="hbtn green" data-action="new-list" title="Create list"><svg class="i"><use href="#i-plus"/></svg><span>New</span></button>
  <span class="spacer"></span>

  <button class="hbtn" data-action="colors" title="Colors" aria-label="Colors"><svg class="i"><use href="#i-palette"/></svg><span class="lbl-opt">Colors</span></button>
  <button class="hbtn" data-action="toggle-theme" title="Dark / light mode"><svg class="i"><use href="#i-moon"/></svg><span class="lbl-opt">Theme</span></button>
  <button class="hbtn" data-action="about" title="About"><svg class="i"><use href="#i-info"/></svg><span class="lbl-opt">About</span></button>
  <button class="hbtn reload" data-action="reload-page" title="Refresh page (also checks for new points and app updates)" aria-label="Refresh page"><svg class="i"><use href="#i-refresh"/></svg><span class="lbl-opt">Refresh</span></button>
